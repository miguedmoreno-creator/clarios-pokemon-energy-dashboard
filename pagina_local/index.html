<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarios - Mapa Interactivo</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  
  </div>

  <!-- Panel Lista de Compras - Guia de NPCs -->
  <div id="npc-list-panel" class="npc-list-panel hidden-panel">
    <div class="npc-list-header">
      <span class="npc-list-icon">&#x1F4CB;</span>
      <span class="npc-list-title">GUIA DE EXPERTOS</span>
    </div>
    <p class="npc-list-subtitle">Selecciona un experto para visitarlo</p>
    <div class="npc-list-items">
      <button class="npc-list-btn" id="btn-npc-0">
        <canvas class="npc-btn-canvas" id="canvas-npc-0" width="32" height="32"></canvas>
        <div class="npc-btn-info">
          <span class="npc-btn-name">Prof. Oak</span>
          <span class="npc-btn-role">Control Predictivo - SLSQP MPC</span>
        </div>
        <span class="npc-btn-arrow">&#x2192;</span>
      </button>
      <button class="npc-list-btn" id="btn-npc-1">
        <canvas class="npc-btn-canvas" id="canvas-npc-1" width="32" height="32"></canvas>
        <div class="npc-btn-info">
          <span class="npc-btn-name">Leaf</span>
          <span class="npc-btn-role">Peak Shaving - HiGHS MILP</span>
        </div>
        <span class="npc-btn-arrow">&#x2192;</span>
      </button>
      <button class="npc-list-btn" id="btn-npc-2">
        <canvas class="npc-btn-canvas" id="canvas-npc-2" width="32" height="32"></canvas>
        <div class="npc-btn-info">
          <span class="npc-btn-name">Erika</span>
          <span class="npc-btn-role">Curva de Carga - What-If Yumbo</span>
        </div>
        <span class="npc-btn-arrow">&#x2192;</span>
      </button>
    </div>
  </div>

  <!-- Boton para mostrar/ocultar panel -->
    <!-- Botones flotantes: EXPERTOS y PANTALLA COMPLETA -->
  <div class="bottom-actions-container">
    <button id="btn-fullscreen" class="toggle-action-btn" title="Pantalla Completa">
      <span>&#x26F6; PANTALLA COMPLETA</span>
    </button>
    <button id="toggle-npc-panel" class="toggle-npc-btn" title="Gu?a de Expertos">
      <span>&#x1F9ED; EXPERTOS</span>
    </button>
  </div>

  <!-- Dialogo / Panel de Informacion del NPC -->
  <div id="npc-dialog" class="npc-dialog hidden">
    <div class="npc-dialog-inner">
      <div class="npc-dialog-header">
        <canvas id="npc-dialog-avatar" width="64" height="64"></canvas>
        <div class="npc-dialog-titles">
          <span id="npc-dialog-name" class="npc-dialog-name"></span>
          <span id="npc-dialog-role" class="npc-dialog-role"></span>
        </div>
        <button class="npc-dialog-close" id="btn-close-dialog">&#x2715;</button>
      </div>
      <p id="npc-dialog-text" class="npc-dialog-text"></p>
      <div id="npc-dialog-chart" class="npc-dialog-chart"></div>
    </div>
  </div>

    <!-- Modal Fullscreen del Dashboard de SantiagoS (Profesor Oak) -->
  <div id="oak-dashboard-modal" class="oak-dashboard-modal hidden">
    <div class="oak-dashboard-overlay" id="oak-dashboard-overlay"></div>
    <div class="oak-dashboard-container">
      <div class="oak-dashboard-header">
        <div class="oak-dashboard-header-left">
          <div class="oak-pokeball-badge"></div>
          <div class="oak-header-text">
            <span class="oak-dashboard-title">CLARIOS ENERGY CONTROL TOWER</span>
            <span class="oak-dashboard-subtitle">PROFESOR OAK ? PLANTA YUMBO ? RETRO GBA</span>
          </div>
        </div>
        <div class="oak-dashboard-header-right">
          <span class="oak-key-badge"><kbd>ESC</kbd> Salir</span>
          <button id="btn-close-oak-dashboard" class="oak-dashboard-close-btn" title="Cerrar Dashboard">? Salir</button>
        </div>
      </div>
      <div class="oak-dashboard-iframe-wrap">
        <iframe id="oak-dashboard-iframe" src="./dashboard/index.html" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- Indicador flotante de interaccion (e.g. [ESPACIO] Abrir Dashboard Pok?mon) -->
  <div id="oak-interaction-prompt" class="oak-interaction-prompt hidden">
    <span class="oak-prompt-key">ESPACIO</span>
    <span class="oak-prompt-text" id="oak-prompt-text">Abrir Dashboard Pok?mon (Prof. Oak)</span>
  </div>

  <main class="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
  </main>

  <script src="./game_v4.js?v=13"></script>
</body>
</html>
